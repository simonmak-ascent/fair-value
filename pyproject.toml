[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-value"
version = "0.2.5"
description = "Financial valuation library (DCF/NAV/CCA, cost of capital, derivatives, credit risk, fixed income) aligned to IVS 2025 / IFRS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simon Mak" }]
keywords = ["valuation", "dcf", "nav", "cca", "wacc", "ivs", "ifrs", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "pandas>=2.3.3",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
# MCP server dependencies (A-004) — never required for the base library.
mcp = ["fastmcp>=4.0.10"]
# Optional analysis backends.
quant = ["QuantLib-Python>=1.18"]
docs = ["mkdocs"]
# Observability (A-016): no-op unless SENTRY_DSN is set.
observability = ["sentry-sdk>=2.71.0"]
# Sibling MCP whose tool surface is delegated to (A-005). Only
# startup-valuation is installable alongside this package (namespaced modules).
# intangible-valuation ships a top-level ``mcp_server`` package that collides
# with ours, so it is loaded from source instead (env INTANGIBLE_VALUATION_SRC).
superset = ["startup-valuation>=2.1.2"]

[project.scripts]
# Console command for the MCP server.
fair-value-mcp = "mcp_server.server:main"

[project.urls]
Repository = "https://github.com/simonmak-ascent/fair-value"

[tool.setuptools]
py-modules = ["valuation_engine"]

[tool.setuptools.packages.find]
include = ["src*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Pragmatic correctness-focused set for a legacy scientific codebase.
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "W291", "W293", "W605"]
per-file-ignores = { "tests/*" = ["F401"] }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
# Analyse imported legacy modules, but only report errors for the modules we own.
follow_imports = "silent"
files = ["mcp_server", "valuation_engine.py", "src/output"]

