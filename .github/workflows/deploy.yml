name: deploy
on:
  # Pull requests are validated on GitHub-hosted runners by ci.yml.
  # Never execute pull-request code on the self-hosted deploy runner.
  push:
    branches: [main]
jobs:
  cd:
    uses: ./.github/workflows/app-cd.yml
    with: { app: fair-value, runner: apg-ecs-01, e2e: false }
    permissions: { contents: read, pull-requests: write }
