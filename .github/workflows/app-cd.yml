name: app-cd

# Self-hosted (in-repo) reusable CD. Called by .github/workflows/deploy.yml.
# Verbs/behaviour mirror apg-infra's platform; handlers live in .deploy/kinds/.
#
# Multi-node: an app whose manifest entry carries `nodes: [ecs-01, ecs-02, ecs-03]`
# is built, deployed and switched on every node, one matrix job per node, all to
# the SAME slot (chosen from the primary node's active-slot) so the fleet cannot
# diverge. Each job runs on that node's runner and the handlers resolve that
# node's own paths from DEPLOY_NODE.
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: apg-ecs-01
      e2e:
        type: boolean
        required: false
        default: false

concurrency:
  # One prod deploy at a time (same ref => serialised, never cancelled);
  # superseded PR-preview deploys are cancelled instead of queueing, so a
  # burst of previews can no longer starve the required `check` on the runner.
  group: app-cd-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the fleet and the target slot once, on the primary node.
  plan:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner }}"]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      slot: ${{ steps.plan.outputs.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve nodes and target slot
        id: plan
        run: |
          APP='${{ inputs.app }}'
          MATRIX=$(python3 -c "import json,sys,yaml;d=yaml.safe_load(open('$GITHUB_WORKSPACE/.deploy/apps.yaml'));a={x['name']:x for x in d['apps']}['$APP'];nodes=a.get('nodes') or [a['node']];print(json.dumps([{'node':n,'runner':d['nodes'][n]['runner'][-1]} for n in nodes]))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          CUR=$(cat "/srv/apps/$APP/active-slot" 2>/dev/null || echo blue)
          [ "$CUR" = blue ] && NEXT=green || NEXT=blue
          echo "slot=$NEXT" >> "$GITHUB_OUTPUT"
          echo "fleet=$MATRIX target slot=$NEXT (was $CUR)"

  cd:
    needs: plan
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    env:
      MANIFEST: ${{ github.workspace }}/.deploy/apps.yaml
      APP: ${{ inputs.app }}
      REPO_DIR: ${{ github.workspace }}
      KIND_DIR: ${{ github.workspace }}/.deploy/kinds
      DEPLOY_NODE: ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve kind
        id: kind
        run: |
          KIND=$(python3 -c "import yaml;d=yaml.safe_load(open('$MANIFEST'));print({a['name']:a['kind'] for a in d['apps']}['$APP'])")
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" build

      - name: Deploy to inactive slot
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" deploy "${{ needs.plan.outputs.slot }}"

      - name: Switch production traffic
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" switch "${{ needs.plan.outputs.slot }}"

      - name: Smoke test
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" smoke

      # Mobile layout: a 390px viewport must not scroll horizontally. The smoke verb only checks
      # health, so a mobile regression used to be able to go live; this runs right after the switch
      # and FAILS the job (=> the rollback step) on a real overflow. It is one pass, not the whole
      # gate: non-200s are skipped inside the check, so rate limiting cannot fail a healthy deploy,
      # and a wholly unreachable run still fails rather than passing blind.
      # Runs once, on the primary node — it audits the site, not the fleet.
      - name: Mobile layout check (390px)
        if: matrix.runner == inputs.runner
        run: node scripts/audit-e2e.mjs --mobile-only

      # Keyless search-engine submission (IndexNow); non-blocking by design —
      # a rejected batch must not fail or roll back a healthy deploy.
      - name: Submit to IndexNow
        if: matrix.runner == inputs.runner
        continue-on-error: true
        run: node scripts/indexnow.mjs

  # If any node failed, return every node to the slot it ran before the deploy —
  # a half-deployed fleet is worse than an old release everywhere.
  rollback:
    needs: [plan, cd]
    if: failure() && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    env:
      MANIFEST: ${{ github.workspace }}/.deploy/apps.yaml
      APP: ${{ inputs.app }}
      REPO_DIR: ${{ github.workspace }}
      KIND_DIR: ${{ github.workspace }}/.deploy/kinds
      DEPLOY_NODE: ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve kind
        id: kind
        run: |
          KIND=$(python3 -c "import yaml;d=yaml.safe_load(open('$MANIFEST'));print({a['name']:a['kind'] for a in d['apps']}['$APP'])")
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Roll back
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" rollback "${{ needs.plan.outputs.slot }}"

  preview:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner }}"]
    env:
      MANIFEST: ${{ github.workspace }}/.deploy/apps.yaml
      APP: ${{ inputs.app }}
      REPO_DIR: ${{ github.workspace }}
      KIND_DIR: ${{ github.workspace }}/.deploy/kinds
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve kind
        id: kind
        run: |
          KIND=$(python3 -c "import yaml;d=yaml.safe_load(open('$MANIFEST'));print({a['name']:a['kind'] for a in d['apps']}['$APP'])")
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" build

      - name: Deploy preview
        id: preview
        run: |
          TS=$(date -u +%Y%m%dT%H%M%S)
          HOST=$(bash "$KIND_DIR/${{ steps.kind.outputs.kind }}.sh" preview "$TS" | tail -1)
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: cd-preview
          message: |
            🌐 **Preview** (${{ inputs.app }}): https://${{ steps.preview.outputs.host }}
            _commit ${{ github.event.pull_request.head.sha }} — rebuilds on every push._
