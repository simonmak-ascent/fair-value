name: deploy-digest

# Deploy a pinned image digest to the fleet.
#
#   gh workflow run deploy-digest.yml -f digest=sha256:…
#
# The deployment logic is not in this file. It is `deploy/container/rollout.sh`, vendored from
# apg-infra at the commit in `deploy/container/VERSION` — GitHub refused the shared reusable-workflow
# form for these user-owned private repositories even with `access_level: user`, so the standard is
# carried as an exact copy and gated by checksum (`apg-infra/deploy/container/check.sh`).
#
# What this file guarantees on its own: the digest must be the one container.json pins, so nothing is
# deployed that has not been through a pull request.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest, e.g. sha256:… — must be the one container.json pins"
        required: true
        type: string
      containers:
        description: "Container names from container.json, comma separated"
        required: false
        default: "fair-value-mcp"
        type: string
      docker_names:
        description: "Names on the node, in the same order"
        required: false
        default: "fv-mcp"
        type: string
      publish_pointer:
        description: "Move the :desired tag so every node converges onto this digest"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Resolve and print the run command without changing anything"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # moving the :desired pointer is a tag push

concurrency:
  group: deploy-digest-${{ inputs.containers }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, apg-ecs-01]
    steps:
      - uses: actions/checkout@v7

      - name: The digest must be the one this repository declares
        env:
          DIGEST: ${{ inputs.digest }}
          CONTAINERS: ${{ inputs.containers }}
        run: |
          set -eu
          python3 - "$DIGEST" "$CONTAINERS" <<'PY'
          import json, sys
          digest, names = sys.argv[1].removeprefix("sha256:"), [n.strip() for n in sys.argv[2].split(",") if n.strip()]
          manifest = json.load(open("container.json"))
          items = {c["name"]: c for c in (manifest.get("containers") or [manifest])}
          bad = 0
          for name in names:
              spec = items.get(name)
              if spec is None:
                  print(f"::error::'{name}' is not in container.json (have: {', '.join(items)})")
                  bad += 1
                  continue
              pinned = (spec.get("image") or "").split("@")[-1].removeprefix("sha256:")
              if pinned != digest:
                  print(f"::error::{name} pins {pinned[:19] or '(nothing)'} but you asked for {digest[:19]} — open a pull request that pins it, so the gate runs first")
                  bad += 1
          raise SystemExit(1 if bad else 0)
          PY

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull once, then roll out to every container and peer
        env:
          CONTAINERS: ${{ inputs.containers }}
          DOCKER_NAMES: ${{ inputs.docker_names }}
          DIGEST: ${{ inputs.digest }}
          PUBLISH_POINTER: ${{ inputs.publish_pointer }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          ref="ghcr.io/${{ github.repository }}@${DIGEST}"
          attempt=1
          while ! docker pull "$ref"; do
            echo "pull attempt $attempt failed; retrying in 10s" >&2
            attempt=$((attempt + 1))
            [ "$attempt" -gt 3 ] && exit 1
            sleep 10
          done

          IFS=',' read -r -a mans <<< "$CONTAINERS"
          IFS=',' read -r -a dns <<< "${DOCKER_NAMES:-$CONTAINERS}"
          for i in "${!mans[@]}"; do
            args=(--container "${mans[$i]}" --digest "$DIGEST")
            [ -n "${dns[$i]:-}" ] && args+=(--docker-name "${dns[$i]}")
            [ "$PUBLISH_POINTER" = "true" ] && args+=(--publish-pointer)
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            bash deploy/container/rollout.sh "${args[@]}"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
