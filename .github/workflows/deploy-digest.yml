name: deploy-digest

# Deploy one or more containers on one node, by digest, in a single job.
#
# Why a list: three containers across three nodes used to mean nine queued jobs
# behind three runners — measured queue wait 4m44s against a 20-35 s job. One job
# per node fixes that: the image is pulled once, then each container is swapped
# while the runner is already warm.
#
#   gh workflow run deploy-digest.yml -f containers=iv-api,iv-mcp \
#     -f digest=sha256:… -f runner=apg-ecs-01
#
# Port, health, env file and command come from container.json through
# scripts/container-spec.py, so the declaration stays the single source of truth.

on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Container names from container.json, comma separated"
        required: true
        type: string
      docker_names:
        description: "Names on the node, comma separated in the same order (default: manifest names)"
        required: false
        type: string
      digest:
        description: "Image digest, e.g. sha256:f3625924…"
        required: true
        type: string
      runner:
        description: "Runner label on the target node"
        required: true
        type: choice
        options: [apg-ecs-01, apg-ecs-02, apg-ecs-03]

permissions:
  contents: read
  packages: read

# The same containers on the same node are never deployed twice at once; a second
# dispatch waits instead of racing the first into `docker rm`.
concurrency:
  group: deploy-${{ inputs.runner }}-${{ inputs.containers }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and deploy each container
        env:
          CONTAINERS: ${{ inputs.containers }}
          DOCKER_NAMES: ${{ inputs.docker_names }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -eu
          ref="ghcr.io/${{ github.repository }}@$DIGEST"

          # one pull for the image, not one per container: they share it
          attempt=1
          while ! docker pull "$ref"; do
            echo "pull attempt $attempt failed; retrying in 10s" >&2
            attempt=$((attempt + 1))
            [ "$attempt" -gt 3 ] && exit 1
            sleep 10
          done

          names="${DOCKER_NAMES:-$CONTAINERS}"
          IFS=',' read -r -a mans <<< "$CONTAINERS"
          IFS=',' read -r -a dns <<< "$names"

          for i in "${!mans[@]}"; do
            man="${mans[$i]}"
            name="${dns[$i]:-${mans[$i]}}"

            spec_out=$(python3 scripts/container-spec.py "$man") || {
              echo "container '$man' is not in container.json — check the containers input" >&2
              exit 1
            }
            eval "$spec_out"
            mapfile -t CMD < <(python3 scripts/container-spec.py "$man" --cmd)

            # pre-flight: nothing is removed until these hold
            docker image inspect "$ref" >/dev/null
            if [ -n "${ENVFILE:-}" ] && [ ! -r "$ENVFILE" ]; then
              echo "env file $ENVFILE is not readable by $(id -un)" >&2
              exit 1
            fi

            opts=(--restart unless-stopped -e NODE_ENV=production -e "PORT=$PORT")
            [ -n "${ENVFILE:-}" ] && opts+=(--env-file "$ENVFILE")

            # probe on a spare port: a bad command must not take the live one down
            docker rm -f "$name.probe" >/dev/null 2>&1 || true
            docker run -d --name "$name.probe" "${opts[@]}" \
              -p "127.0.0.1:$((PORT + 10000)):$PORT" \
              "$ref" ${CMD[@]+"${CMD[@]}"} >/dev/null

            ok=0
            for _ in 1 2 3 4 5 6 7 8; do
              if [ "$PROTO" = tcp ]; then
                [ "$(docker inspect "$name.probe" -f '{{.State.Status}}')" = running ] && { ok=1; break; }
              else
                code=$(curl -sS -m 3 -o /dev/null -w '%{http_code}' \
                       -H "Host: ${HEALTH_HOST:-localhost}" \
                       "http://127.0.0.1:$((PORT + 10000))$HEALTH_PATH" || true)
                [ "$code" = 200 ] && { ok=1; break; }
              fi
              sleep 1
            done

            if [ "$ok" != 1 ]; then
              echo "probe for $name did not come up; the live container is untouched" >&2
              docker logs --tail 30 "$name.probe" >&2 || true
              docker rm -f "$name.probe" >/dev/null 2>&1 || true
              exit 1
            fi
            docker rm -f "$name.probe" >/dev/null 2>&1

            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" "${opts[@]}" -p "0.0.0.0:$PORT:$PORT" \
              "$ref" ${CMD[@]+"${CMD[@]}"} >/dev/null

            for _ in 1 2 3 4 5; do
              [ "$(docker inspect "$name" -f '{{.State.Status}}')" = running ] && break
              sleep 1
            done
            echo "$name: $(docker inspect "$name" -f '{{.State.Status}}') $(docker inspect "$name" -f '{{.Config.Image}}' | sed 's|.*@||' | cut -c1-19)"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
