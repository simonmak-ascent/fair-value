name: license

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pip-licenses

      - name: Production licence inventory
        run: pip-licenses --format=json > licenses.json

      - name: Enforce licence policy
        run: python .github/scripts/check-licenses.py licenses.json

      - name: Build SBOM (CycloneDX)
        run: python .github/scripts/make-sbom.py licenses.json sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fair-value-sbom
          path: sbom.cdx.json
