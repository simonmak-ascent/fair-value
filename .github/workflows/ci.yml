name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests with coverage
        run: >
          python -m pytest
          --cov=src --cov=mcp_server --cov=valuation_engine
          --cov-report=term-missing

      - name: Tool-surface + superset conformance
        run: python scripts/check_conformance.py

      - name: Install + server-build smoke
        run: |
          pip install .
          python -c "import mcp_server.server as s; assert s.FASTMCP_AVAILABLE, 'fastmcp not installed'; s.build_server(); print('server build smoke ok')"
