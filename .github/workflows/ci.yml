name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Optional native engine: enables the QuantLib option priced backend
          # and the parity tests (otherwise skipped). Lightweight single wheel.
          pip install QuantLib

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests with coverage
        run: >
          python -m pytest
          --cov=src --cov=mcp_server --cov=valuation_engine
          --cov-report=term-missing

      - name: Registry + surface conformance
        run: python scripts/check_conformance.py

      - name: Generated docs in sync
        run: |
          python scripts/gen_docs.py
          git diff --exit-code -- docs/methods docs/standards.md

      - name: Tool Definition Quality (TDQS lint)
        run: python -m tdqs lint --command "python -m mcp_server.server" --fail-on error

      - name: Install + server-build smoke
        run: |
          pip install .
          python -c "import mcp_server.server as s; assert s.FASTMCP_AVAILABLE, 'fastmcp not installed'; s.build_server(); print('server build smoke ok')"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build docs (mkdocs)
        run: |
          python -m pip install --upgrade pip mkdocs
          mkdocs build --strict

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate catalog data
        run: python scripts/gen_web_data.py

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

