name: Secret Scan

# Removed by `chore(ci): prune to build, test and release (#45)` and restored 2026-11-20: the pruning
# left `.gitleaks.toml` in the tree with no caller, so a secret committed after that day would have
# been found by nobody. Runs on GitHub-hosted runners on purpose — PR code never runs on a node.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
