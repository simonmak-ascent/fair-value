name: Feature / method request
description: Propose a new valuation method, tool, standard clause, or integration
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What valuation task is not covered today?
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Governing standard clause
      description: IVS / IFRS / IAS clause(s) this implements.
      placeholder: IVS.500.A10 / IFRS.13.62
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Proposed method + inputs
      description: Method id, required inputs (no defaults), and the output it should return.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Verbatim clause source, formula reference, or worked example.
    validations:
      required: false
