version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        # Keep major bumps out of the group so each lands as its own
        # reviewable, revertable PR. exclude-patterns is the definitive
        # guard: update-types alone can silently suppress individual major
        # PRs (dependabot-core#14202).
        update-types: ["minor", "patch"]
        exclude-patterns: ["numpy", "fastmcp"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
